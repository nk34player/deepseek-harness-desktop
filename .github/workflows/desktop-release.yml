# Build and publish the Electron desktop app installers: macOS arm64 and
# macOS x64 .dmg installers plus a Windows x64 NSIS installer. A tag push to
# dsh-v* (the desktop app shares the dsh family's version and tag) creates a
# GitHub Release with the installers; a manual dispatch can rehearse the build
# with publish=false or publish from such a tag.
#
# The macOS jobs sign with the Developer ID Application identity and notarize
# via notarytool (credentials come from repository secrets). When the
# certificate secrets are absent each job builds unsigned instead of failing,
# so a release can still be produced from a machine without the certificate.
# The Windows job stays unsigned until an Authenticode certificate is added.
# The macOS x64 job cross-builds the x64 slice on the arm64 runner (and stages
# the darwin-x64 Node runtime + harness closure via DSH_DESKTOP_ARCH=x64), so
# Intel Macs get a working installer. The installers use
# fixed, version-free filenames (set in electron-builder.yml), so the
# releases/latest/download/<name> links in the READMEs always resolve to the
# newest release. electron-builder's `publish` config (with `--publish never`)
# also writes the `latest-mac.yml` / `latest.yml` update metadata, which the
# jobs upload alongside the installers to serve the in-app electron-updater
# feed.
name: Release (Desktop)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release from the built installers. Only valid from a dsh-v* tag.
        required: true
        type: boolean
        default: false
  push:
    tags: ['dsh-v*']

permissions:
  contents: read

concurrency:
  # Pack runs per ref so a manual rehearse never displaces a tag push; the
  # release job below is the only step that writes and it targets one tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-macos:
    name: macOS (arm64 dmg)
    runs-on: macos-14
    # GitHub Actions forbids the `secrets` context inside `if:` conditions, so
    # the certificate-presence boolean is computed once as a job env var and
    # the steps branch on it.
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' && secrets.MAC_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      # Import the Developer ID Application .p12 into a scratch keychain and
      # let codesign read the private key without prompting; electron-builder
      # resolves `mac.identity` against this default keychain. When either
      # certificate secret is absent the step is skipped and the packaging step
      # below builds unsigned instead.
      - name: Import signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERT_PASSWORD" build.keychain

      # electron-builder notarizes with notarytool; APPLE_API_KEY must name the
      # App Store Connect API key's .p8 file, so decode the secret to disk and
      # point the env var at it for the packaging steps. When the API key
      # secrets are absent, leave the vars unset so electron-builder skips
      # notarization and still produces a signed installer.
      - name: Prepare notarization credentials
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          else
            echo "Notarization credentials not set; the macOS installer will be signed but not notarized."
          fi

      # dist:mac stages the self-contained runtime (macOS Node runtime + the
      # deployed harness) and builds the host-arch (arm64) dmg, signing with
      # the pinned Developer ID identity and notarizing via notarytool.
      # When the certificate secrets are absent the import step above is
      # skipped and dist:mac:unsigned runs instead, nulling the identity and
      # disabling notarization so the release packages without the certificate.
      - name: Package macOS
        if: env.HAS_MAC_CERT == 'true'
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:mac

      - name: Package macOS (unsigned)
        if: env.HAS_MAC_CERT == 'false'
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:mac:unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  build-macos-x64:
    name: macOS (x64 dmg)
    runs-on: macos-14
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' && secrets.MAC_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Import signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERT_PASSWORD" build.keychain

      - name: Prepare notarization credentials
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          else
            echo "Notarization credentials not set; the macOS installer will be signed but not notarized."
          fi

      # dist:mac:x64 stages the darwin-x64 Node runtime and harness closure
      # (DSH_DESKTOP_ARCH=x64) and cross-builds the x64 dmg on the arm64 runner,
      # signing with the pinned Developer ID identity and notarizing via
      # notarytool; the unsigned variant runs when the certificate is absent.
      - name: Package macOS (x64)
        if: env.HAS_MAC_CERT == 'true'
        env:
          DSH_DESKTOP_ARCH: x64
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:mac:x64

      - name: Package macOS (x64, unsigned)
        if: env.HAS_MAC_CERT == 'false'
        env:
          DSH_DESKTOP_ARCH: x64
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:mac:x64:unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows (x64 NSIS)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Package Windows
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build-macos, build-macos-x64, build-windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Verify release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/dsh-v*) ;;
            *) echo "::error::release requires a dsh-v* tag, got ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${GITHUB_REF#refs/tags/dsh-v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" \
              --title "DeepSeek Harness Desktop ${version}" \
              --generate-notes \
              dist/*
          fi
