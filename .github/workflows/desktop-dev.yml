# Build the desktop installers from the dev branch and upload them as
# artifacts — a dev build, not a release. Every push to dev rebuilds the
# macOS arm64 .dmg and the Windows x64 NSIS installer so the latest dev state
# is downloadable from the Actions run. The dev build is unsigned (no
# certificate secrets) and never creates a GitHub Release; that path stays
# with desktop-release.yml on dsh-v* tags.
name: Desktop (dev build)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-macos:
    name: macOS (arm64 dmg, unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      # Dev builds have no signing certificate, so null the release identity
      # pinned in electron-builder.yml and skip notarization; the result is
      # an unsigned dmg for testing only. Uses the same dist:mac script as
      # the release workflow, with the overrides appended via --.
      - name: Package macOS (unsigned)
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:mac -- --config.mac.identity=null --config.mac.notarize=false

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dev-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows (x64 NSIS, unsigned)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Package Windows
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dev-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7
