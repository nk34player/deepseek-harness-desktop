appId: com.deepseek.dsh-desktop
productName: DeepSeek Harness
# Fixed, version-free filenames so `releases/latest/download/…` one-click links
# stay stable across releases. ${arch} keeps the platforms unambiguous:
# DeepSeek.Harness-arm64.dmg on macOS, DeepSeek.Harness-x64.exe on Windows.
artifactName: DeepSeek.Harness-${arch}.${ext}
directories:
  output: release
files:
  - lib/**
  - preload.cjs
  - package.json
extraResources:
  - from: vendor/runtime
    to: runtime
  - from: vendor/harness
    to: harness
  - from: resources
    to: desktop-resources
asar: true
# The shell has no in-process native dependencies — the harness runs as a
# child process on its bundled Node — so skip electron-builder's dependency
# rebuild (which would otherwise re-run `pnpm install --production` and trip
# the workspace's postinstall).
npmRebuild: false
# In-app auto-update feed. electron-updater reads the `latest-mac.yml` /
# `latest.yml` this config generates (written locally even under
# `--publish never`) and downloads the release assets they name. The release
# workflow uploads that metadata alongside the installers.
publish:
  provider: github
  owner: salathleizhang
  repo: deepseek-harness-desktop
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # The Developer ID Application identity signs the distribution build; the
  # same identity is notarized via `notarytool` (credentials come from the
  # release workflow's environment).
  identity: "Junwei Zhang (7HP3X3977Y)"
  notarize: true
  # The universal build (dist:mac:universal) merges an arm64 and an x64 app.
  # The staged harness closure (extraResources -> Resources/harness) ships BOTH
  # per-arch native packages (koffi @koromix/koffi-darwin-*, sharp
  # @img/sharp-darwin-*, node-pty prebuilds) in the identical shared tree, so
  # those Mach-O files are byte-identical across the two builds. @electron/universal
  # refuses to lipo identical files unless they match x64ArchFiles; skipping the
  # merge is correct here because each variant is single-arch and self-selected at
  # runtime by process.arch. Everything else under the app bundle (Electron
  # framework, the shell binary) still gets lipo-merged normally.
  x64ArchFiles: "Contents/Resources/harness/node_modules/**"
  # `dmg` stays the one-click manual installer; `zip` is the artifact
  # electron-updater downloads for in-app updates (macOS silent replace).
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
